[project]
name = "codeintel"
version = "0.1.0"
description = "Agentic codebase intelligence CLI grounded in a real call/import graph, not just embeddings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "networkx>=3.3",
    "anthropic>=0.34",
    "voyageai>=0.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
]

[project.scripts]
codeintel = "src.cli:app"

# Vercel's Python entrypoint auto-detection only scans for specific
# filenames (app.py/index.py/server.py/main.py/wsgi.py/asgi.py) — and
# separately, its fallback repo-wide scan for anything named
# app/handler/application picks up unrelated matches like the Typer
# `app` in src/cli.py. Declaring the entrypoint explicitly avoids both
# problems. All /api/* routes are consolidated into this one file
# (api/index.py), with routing done in Python (self.path), rather than
# one file per endpoint — multiple files each defining their own
# top-level `handler` would reintroduce the exact ambiguity above, and
# this config can only point at one of them.
[tool.vercel]
entrypoint = "api.index:handler"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
