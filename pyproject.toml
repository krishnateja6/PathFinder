[project]
name = "codeintel"
version = "0.1.0"
description = "Agentic codebase intelligence CLI grounded in a real call/import graph, not just embeddings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "networkx>=3.3",
    "anthropic>=0.34",
    "voyageai>=0.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.scripts]
codeintel = "src.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
