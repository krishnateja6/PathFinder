[project]
name = "codeintel"
version = "0.1.0"
description = "Agentic codebase intelligence CLI grounded in a real call/import graph, not just embeddings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "networkx>=3.3",
    "anthropic>=0.34",
    "voyageai>=0.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
]

[project.scripts]
codeintel = "src.cli:app"

# Vercel's Python entrypoint auto-detection only scans for specific
# filenames (app.py/index.py/server.py/main.py/wsgi.py/asgi.py). Our
# function lives at api/ask.py, which isn't one of those, so its
# fallback repo-wide scan for anything named app/handler/application
# also picks up the unrelated Typer `app` in src/cli.py and its import
# in tests/test_cli_smoke.py. Declaring the entrypoint explicitly here
# resolves that ambiguity without renaming api/ask.py or restructuring
# anything; it does not change what api/ask.py handles (still just
# /api/ask) or affect static file serving from public/.
[tool.vercel]
entrypoint = "api.ask:handler"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
